syntax = "proto3";

package fantasy.v1;

option go_package = "clara-mundi/internal/protocol/pb";

import "google/protobuf/struct.proto";

// Shared gameplay types. Field names match the existing JSON wire contract
// (snake_case) so protojson UseProtoNames round-trips with protocol.Encode.

message CharacterAppearance {
  string skin = 1;
  string face = 2;
  string hair = 3;
  string hair_color = 4;
  string cloth = 5;
  string cloth_color = 6;
  string weapon = 7;
  string weapon_color = 8;
}

message Item {
  string id = 1;
  string name = 2;
  string kind = 3;
  string slot = 4;
  string type = 5;
  string consumable = 6;
  string rarity = 7;
  int32 level = 8;
  int32 qty = 9;
  map<string, int32> stats = 10;
}

message StatusSnapshot {
  string kind = 1;
  double potency = 2;
  int32 remaining = 3;
  int32 shield_hp = 4;
}

message SkillInfo {
  string id = 1;
  string name = 2;
  int32 mp_cost = 3;
  bool heals = 4;
  bool buffs = 5;
  string description = 6;
  string job = 7;
  string category = 8;
  string prereq = 9;
  repeated string weapon_reqs = 10;
  bool unlocked = 11;
  int32 level = 12;
  int32 max_level = 13;
  int32 unlock_level = 14;
  int32 prof_exp = 15;
  int32 prof_exp_next = 16;
  int32 cast_time_ms = 17;
  bool world_only = 18;
  int32 cooldown_ms = 19;
  bool passive = 20;
  int32 combo_length = 21;
  string proficiency = 22;
}

message JobProgressInfo {
  string id = 1;
  string name = 2;
  string abbr = 3;
  string category = 4;
  int32 level = 5;
  int32 xp = 6;
  int32 max_xp = 7;
}

message StatBlock {
  int32 hp = 1;
  int32 mp = 2;
  int32 str = 3;
  int32 mag = 4;
  int32 agi = 5;
}

message HotbarBinding {
  string kind = 1;
  string id = 2;
}

message VisitedSavePoint {
  string id = 1;
  string name = 2;
  string map_name = 3;
  bool home = 4;
}

message PetRecord {
  string id = 1;
  string kind = 2;
  string name = 3;
  int32 level = 4;
}

message ProfileInfo {
  string name = 1;
  int32 level = 2;
  int32 xp = 3;
  int32 max_xp = 4;
  string race = 5;
  string main_job = 6;
  string sub_job = 7;
  int32 subjob_unlock_level = 8;
  repeated string unlocked_jobs = 9;
  CharacterAppearance appearance = 10;
  repeated JobProgressInfo jobs = 11;
  StatBlock stats = 12;
  repeated Item inventory = 13;
  map<string, string> equipped = 14;
  map<string, HotbarBinding> hotbar = 15;
  repeated SkillInfo skills = 16;
  repeated string friends = 17;
  string save_point_id = 18;
  string save_point_name = 19;
  repeated VisitedSavePoint visited_save_points = 20;
  map<string, string> keybinds = 21;
  string camp_skin = 22;
  repeated Item house_storage = 23;
  int32 house_storage_capacity = 24;
  repeated PetRecord pets = 25;
  // follow_pet_id is retired: the single active pet (battle_pet_id) both
  // follows and fights. Field 26 stays reserved for old saves/clients.
  string follow_pet_id = 26;
  string battle_pet_id = 27;
  reserved 28;
  map<string, int32> prof_levels = 29;
  map<string, int32> prof_exp = 30;
  // Pet the mount keybind will ride once mounting is implemented.
  string mount_pet_id = 31;
}

message OverworldMap {
  int32 tile = 1;
  int32 cols = 2;
  int32 rows = 3;
  string cells = 4;
}

message MapTerrainLayers {
  repeated int32 ground = 1;
  repeated int32 collision = 2;
}

message MapTileOverrides {
  string map_id = 1;
  google.protobuf.Struct layers = 2;
  string updated_at = 3;
}

message MapPortal {
  double x = 1;
  double y = 2;
  double w = 3;
  double h = 4;
}

message MapNeighbor {
  string id = 1;
  double x = 2;
  double y = 3;
}

message MapSnapshot {
  string id = 1;
  string name = 2;
  OverworldMap overworld = 6;
  string tiled_map = 7;
  repeated MapPortal portals = 8;
  MapTileOverrides tile_overrides = 9;
  MapTerrainLayers terrain_layers = 10;
  // World-space placement from the border-graph layout: this map's origin
  // plus every bordered map's origin, so clients can overlay neighbors in
  // one scene.
  double origin_x = 11;
  double origin_y = 12;
  repeated MapNeighbor neighbors = 13;
}

// WorldEntity is the unified snapshot for every world inhabitant: players,
// NPCs, and pets. kind selects the entity class ("player" | "npc" | "pet");
// fields that don't apply to a kind stay at their proto defaults.
message WorldEntity {
  string id = 1;
  string name = 2;
  string kind = 3;
  string sprite = 4; // enemy key / pet kind / player race
  string owner_id = 5;
  int32 level = 6;
  double x = 7;
  double y = 8;
  double facing = 9; // Y-axis yaw radians
  int32 hp = 10;
  int32 max_hp = 11;
  int32 mp = 12;
  int32 max_mp = 13;
  double stamina = 14;
  bool alive = 15;
  bool engaged = 16; // in combat
  bool is_ally = 17;
  string target_id = 18;
  repeated StatusSnapshot statuses = 19;
  bool capturable = 20;
  double skill_atb = 21;
  bool has_queued_action = 22;
  string casting_skill_id = 23;
  string cast_target_id = 24;
  double cast_progress = 25;
  int32 cast_time_ms = 26;
  int64 cast_ends_at = 27; // unix millis
  // Player presence extras.
  string weapon = 28;
  string main_job = 29;
  string sub_job = 30;
  CharacterAppearance appearance = 31;
  int64 immune_until = 32; // unix millis; collision/search blocked
  bool in_house = 33;
  string house_owner = 34;
  // Mounted players ride their profile mount pet; mount_sprite is the pet
  // kind so remote clients can draw the creature under the rider.
  bool mounted = 35;
  string mount_sprite = 36;
}

message WorldCamp {
  string owner_name = 1;
  string owner_id = 2;
  double x = 3;
  double y = 4;
  string skin = 5;
}

message HouseFurniture {
  string id = 1;
  int32 col = 2;
  int32 row = 3;
  string owner = 4;
  Item item = 5;
}

message HousePlayer {
  string id = 1;
  string name = 2;
  double x = 3;
  double y = 4;
  double facing = 5; // Y-axis yaw radians
  bool owner = 6;
  repeated HousePet pets = 7;
}

message HousePet {
  string id = 1;
  string name = 2;
  string sprite = 3; // pet kind / enemy sprite key
  double x = 4;
  double y = 5;
  double facing = 6;
}

message HousePOI {
  string id = 1;
  string kind = 2;
  string name = 3;
  double x = 4;
  double y = 5;
}

message SavePoint {
  string id = 1;
  string name = 2;
  double x = 3;
  double y = 4;
}

message JobChanger {
  string id = 1;
  string name = 2;
  double x = 3;
  double y = 4;
}

message PlayerReward {
  string player_id = 1;
  int32 xp = 2;
  int32 sub_xp = 3;
  int32 levels_gained = 4;
  int32 sub_levels_gained = 5;
  int32 new_level = 6;
  int32 new_xp = 7;
  int32 max_xp = 8;
  int32 sub_new_level = 9;
  int32 sub_new_xp = 10;
  int32 sub_max_xp = 11;
  repeated Item loot = 12;
  bool passive = 13;
  bool party_bonus = 14;
}

message FriendInfo {
  string name = 1;
  bool online = 2;
  int32 level = 3;
  string weapon = 4;
  bool in_combat = 5;
}

message PartyMember {
  string id = 1;
  string name = 2;
  int32 level = 3;
  string weapon = 4;
  bool leader = 5;
  bool in_combat = 6;
}

message PartyInfo {
  string id = 1;
  string leader_id = 2;
  repeated PartyMember members = 3;
}


