# Live reload for the Go server during development.
# Run: npm run server:dev

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/server"
  entrypoint = ["./tmp/main"]
  delay = 500
  exclude_dir = ["tmp", "bin", "wails", "node_modules", "data", "scripts", "unity"]
  exclude_regex = ["_test\\.go$"]
  include_dir = ["cmd", "internal"]
  # Only rebuild on Go changes. Runtime writes under data/ must not restart Air.
  include_ext = ["go"]
  stop_on_error = true

[build.windows]
  cmd = "go build -o ./tmp/main.exe ./cmd/server"
  entrypoint = ["tmp\\main.exe"]

[log]
  time = true

[screen]
  clear_on_rebuild = true
